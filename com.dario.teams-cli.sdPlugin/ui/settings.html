<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams controls</title>
  <style>
    :root { color-scheme: dark; font: 12px -apple-system, BlinkMacSystemFont, sans-serif; color: #dedede; background: #2d2d2d; }
    body { margin: 14px; }
    p { line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; background: #202020; border: 1px solid #737373; border-radius: 4px; color: white; }
    input:focus, button:focus-visible { outline: 2px solid #62d6ac; outline-offset: 2px; }
    button { margin-top: 8px; padding: 7px 15px; border: 1px solid #737373; border-radius: 4px; background: #424242; color: white; cursor: pointer; }
    #status { border-left: 3px solid #8b98a9; padding-left: 10px; margin-top: 18px; }
    #reason { overflow-wrap: anywhere; color: #aeb6c2; }
    .hint { color: #bfc5cc; }
  </style>
</head>
<body>
  <p id="description">Shows the state reported by Microsoft Teams. Press the key to toggle. While TOGGLING is shown, additional presses are ignored.</p>
  <form id="settings">
    <label for="cliPath">Teams CLI executable</label>
    <input id="cliPath" name="cliPath" type="text" spellcheck="false" autocomplete="off" placeholder="/absolute/path/to/teams" required>
    <button id="save" type="submit" disabled>Save path</button>
    <p class="hint">Use the compiled <code>teams</code> executable, not its source folder. <span id="operationHint">Reads refresh automatically while this key is visible.</span></p>
  </form>
  <div id="status" role="status" aria-live="polite">
    <strong id="label">CONNECTING</strong>
    <p id="detail">Waiting for Stream Deck…</p>
    <p id="reason"></p>
  </div>
  <script src="settings.js"></script>
</body>
</html>
